name: Frontend CI

on:
  push:
    branches: [ frontend ]
  pull_request:
    branches: [ main, frontend, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      # - name: Lint
      #   run: |
      #     cd frontend
      #     npm run lint

      # - name: Run tests
      #   run: |
      #     cd frontend
      #     npm run test


      - name: Criar service_account.json a partir do secret
        run: echo "$GDRIVE_SERVICE_ACCOUNT_JSON" > frontend/service_account.json
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}

      - name: Build Docker image
        run: |
          cd frontend
          docker build -t thelipesousa/frontend:latest .

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push thelipesousa/frontend:latest
